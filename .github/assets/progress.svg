<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 96" width="1000" height="96" role="img" aria-labelledby="t">
  <title id="t">Roadmap progress: 4 of 8 phases shipped</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.6" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="barClip"><rect x="24" y="52" width="952" height="18" rx="9"/></clipPath>
    <clipPath id="doneClip"><rect x="24" y="52" width="476" height="18" rx="9"/></clipPath>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .grow { animation: grow 2.2s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes grow { from { transform: translateX(-476px); } to { transform: translateX(0); } }
      .sweep { animation: sweep 2.6s ease-in-out 2.2s infinite; }
      @keyframes sweep { from { transform: translateX(-160px); } to { transform: translateX(520px); } }
      .blink { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    </style>
  </defs>
  <rect width="1000" height="96" rx="16" fill="url(#bg)"/>

  <text x="24" y="36" font-size="15" font-weight="700" fill="#F8FAFC">4 of 8 phases shipped</text>
  <text x="976" y="36" font-size="13" fill="#94A3B8" text-anchor="end">next up: <tspan fill="#FDE68A" font-weight="600">Phase 4 · Team inbox</tspan></text>

  <rect x="24" y="52" width="952" height="18" rx="9" fill="#1E293B"/>
  <g clip-path="url(#barClip)">
    <g clip-path="url(#doneClip)">
      <rect class="grow" x="24" y="52" width="476" height="18" fill="url(#fill)"/>
      <rect class="sweep" x="24" y="52" width="120" height="18" fill="url(#shine)"/>
    </g>
  </g>
  <!-- phase ticks -->
  <g stroke="#0B1120" stroke-width="3">
    <line x1="143" y1="52" x2="143" y2="70"/>
    <line x1="262" y1="52" x2="262" y2="70"/>
    <line x1="381" y1="52" x2="381" y2="70"/>
    <line x1="500" y1="52" x2="500" y2="70"/>
    <line x1="619" y1="52" x2="619" y2="70"/>
    <line x1="738" y1="52" x2="738" y2="70"/>
    <line x1="857" y1="52" x2="857" y2="70"/>
  </g>
  <circle class="blink" cx="559" cy="61" r="4.5" fill="#FDE68A"/>
  <g font-size="11" fill="#64748B" text-anchor="middle">
    <text x="83" y="87">0 foundations</text>
    <text x="202" y="87">1 accounts</text>
    <text x="321" y="87">2 knowledge</text>
    <text x="440" y="87">3 chat widget</text>
    <text x="559" y="87" fill="#FDE68A">4 inbox</text>
    <text x="678" y="87">5 email</text>
    <text x="797" y="87">6 self-writing KB</text>
    <text x="916" y="87">7 polish</text>
  </g>
</svg>
