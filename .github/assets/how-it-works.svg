<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d">
  <title id="t">How SupportAI works in three steps</title>
  <desc id="d">Step 1, feed it: upload documents, point it at your website, import past tickets. Step 2, paste one line of code on your site. Step 3, it answers customers around the clock and hands hard questions to your team.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity=".25"/>
    </linearGradient>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .hop { animation: hop 3.2s ease-in-out infinite; }
      .h2 { animation-delay: .4s; } .h3 { animation-delay: .8s; } .h4 { animation-delay: 1.2s; }
      @keyframes hop { 0%,70%,100% { transform: translateY(0); } 80% { transform: translateY(-9px); } 90% { transform: translateY(0); } }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .glow { animation: glow 2.4s ease-in-out infinite; }
      @keyframes glow { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      .pop1 { animation: pop1 6s infinite; }
      .pop2 { animation: pop2 6s infinite; }
      @keyframes pop1 { 0%,8% { opacity:0; transform: translateY(8px); } 16%,88% { opacity:1; transform: translateY(0); } 96%,100% { opacity:0; } }
      @keyframes pop2 { 0%,40% { opacity:0; transform: translateY(8px); } 48%,88% { opacity:1; transform: translateY(0); } 96%,100% { opacity:0; } }
    </style>
  </defs>

  <!-- connectors -->
  <path class="flow" d="M312 160 H352" stroke="#67E8F9" stroke-width="3" stroke-linecap="round"/>
  <path d="M346 153 l8 7 l-8 7" stroke="#67E8F9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path class="flow" d="M647 160 H687" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round"/>
  <path d="M681 153 l8 7 l-8 7" stroke="#C4B5FD" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===== card 1 : feed it ===== -->
  <g transform="translate(20,16)">
    <rect width="290" height="288" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
    <circle cx="36" cy="40" r="16" fill="#22D3EE"/>
    <text x="36" y="46" font-size="16" font-weight="800" fill="#0B1120" text-anchor="middle">1</text>
    <text x="62" y="47" font-size="20" font-weight="700" fill="#F8FAFC">Feed it</text>

    <g class="hop"><g transform="translate(34,80)">
      <rect width="100" height="54" rx="10" fill="#FFFFFF" fill-opacity=".06" stroke="#F87171" stroke-opacity=".6"/>
      <path d="M14 12 h14 l6 6 v22 h-20z" fill="#F87171"/>
      <text x="46" y="33" font-size="13" font-weight="700" fill="#FECACA">PDF</text>
    </g></g>
    <g class="hop h2"><g transform="translate(156,80)">
      <rect width="100" height="54" rx="10" fill="#FFFFFF" fill-opacity=".06" stroke="#60A5FA" stroke-opacity=".6"/>
      <path d="M14 12 h14 l6 6 v22 h-20z" fill="#60A5FA"/>
      <text x="46" y="33" font-size="13" font-weight="700" fill="#BFDBFE">Word</text>
    </g></g>
    <g class="hop h3"><g transform="translate(34,146)">
      <rect width="100" height="54" rx="10" fill="#FFFFFF" fill-opacity=".06" stroke="#2DD4BF" stroke-opacity=".6"/>
      <circle cx="24" cy="27" r="11" fill="none" stroke="#2DD4BF" stroke-width="2.2"/>
      <ellipse cx="24" cy="27" rx="4.5" ry="11" fill="none" stroke="#2DD4BF" stroke-width="1.8"/>
      <path d="M13 27 h22" stroke="#2DD4BF" stroke-width="1.8"/>
      <text x="44" y="32" font-size="13" font-weight="700" fill="#99F6E4">Website</text>
    </g></g>
    <g class="hop h4"><g transform="translate(156,146)">
      <rect width="100" height="54" rx="10" fill="#FFFFFF" fill-opacity=".06" stroke="#FBBF24" stroke-opacity=".6"/>
      <rect x="12" y="17" width="24" height="18" rx="3" fill="none" stroke="#FBBF24" stroke-width="2.2"/>
      <path d="M13 19 l11 8 l11 -8" stroke="#FBBF24" stroke-width="2" fill="none" stroke-linejoin="round"/>
      <text x="44" y="32" font-size="13" font-weight="700" fill="#FDE68A">Tickets</text>
    </g></g>

    <text x="24" y="235" font-size="13.5" fill="#CBD5E1">Upload help docs, point it at your</text>
    <text x="24" y="255" font-size="13.5" fill="#CBD5E1">site, import past support emails.</text>
    <text x="24" y="276" font-size="12" fill="#64748B">It re-reads your site daily or weekly.</text>
  </g>

  <!-- ===== card 2 : paste one line ===== -->
  <g transform="translate(355,16)">
    <rect width="290" height="288" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
    <circle cx="36" cy="40" r="16" fill="#A78BFA"/>
    <text x="36" y="46" font-size="16" font-weight="800" fill="#0B1120" text-anchor="middle">2</text>
    <text x="62" y="47" font-size="20" font-weight="700" fill="#F8FAFC">Paste one snippet</text>

    <rect x="20" y="78" width="250" height="124" rx="12" fill="#020617" stroke="#334155"/>
    <circle cx="36" cy="94" r="4" fill="#F87171"/>
    <circle cx="50" cy="94" r="4" fill="#FBBF24"/>
    <circle cx="64" cy="94" r="4" fill="#34D399"/>
    <text class="mono" x="34" y="126" font-size="13"><tspan fill="#F472B6">&lt;script</tspan></text>
    <text class="mono" x="50" y="148" font-size="13"><tspan fill="#67E8F9">src</tspan><tspan fill="#94A3B8">=</tspan><tspan fill="#FDE68A">"…/widget.js"</tspan></text>
    <text class="mono" x="50" y="170" font-size="13"><tspan fill="#67E8F9">data-site-key</tspan><tspan fill="#94A3B8">=</tspan><tspan fill="#FDE68A">"pk_…"</tspan><tspan fill="#F472B6">&gt;</tspan></text>
    <text class="mono" x="34" y="192" font-size="13"><tspan fill="#F472B6">&lt;/script&gt;</tspan></text>
    <rect class="blink" x="116" y="181" width="8" height="15" fill="#E2E8F0"/>

    <text x="24" y="235" font-size="13.5" fill="#CBD5E1">Drop it on any website and your</text>
    <text x="24" y="255" font-size="13.5" fill="#CBD5E1">branded chat shows up. That's it.</text>
    <text x="24" y="276" font-size="12" fill="#64748B">Only your approved domains can use it.</text>
  </g>

  <!-- ===== card 3 : it answers ===== -->
  <g transform="translate(690,16)">
    <rect width="290" height="288" rx="18" fill="url(#card)" stroke="url(#edge)" stroke-width="1.5"/>
    <circle cx="36" cy="40" r="16" fill="#F472B6"/>
    <text x="36" y="46" font-size="16" font-weight="800" fill="#0B1120" text-anchor="middle">3</text>
    <text x="62" y="47" font-size="20" font-weight="700" fill="#F8FAFC">It handles the rest</text>

    <path class="glow" d="M246 76 a13 13 0 1 0 13 17 a10 10 0 0 1 -13 -17z" fill="#FDE68A"/>

    <g class="pop1">
      <rect x="20" y="92" width="206" height="46" rx="14" fill="#10B981" fill-opacity=".14" stroke="#34D399" stroke-opacity=".6"/>
      <circle cx="42" cy="115" r="11" fill="#10B981"/>
      <path d="M37 115 l3.5 3.5 l6.5 -7" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="62" y="112" font-size="13.5" font-weight="700" fill="#A7F3D0">Answered from your docs</text>
      <text x="62" y="129" font-size="11.5" fill="#6EE7B7">in seconds, at any hour</text>
    </g>
    <g class="pop2">
      <rect x="44" y="152" width="226" height="46" rx="14" fill="#F59E0B" fill-opacity=".12" stroke="#FBBF24" stroke-opacity=".6"/>
      <circle cx="66" cy="175" r="11" fill="#F59E0B"/>
      <path d="M61 175 h10 M67 170 l5 5 l-5 5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="172" font-size="13.5" font-weight="700" fill="#FDE68A">Tricky one? To a human</text>
      <text x="86" y="189" font-size="11.5" fill="#FCD34D">email captured, ticket opened</text>
    </g>

    <text x="24" y="235" font-size="13.5" fill="#CBD5E1">Customers get answers at 2 AM.</text>
    <text x="24" y="255" font-size="13.5" fill="#CBD5E1">Your team only sees what needs them.</text>
    <text x="24" y="276" font-size="12" fill="#64748B">Never a raw error, even out of AI quota.</text>
  </g>
</svg>
