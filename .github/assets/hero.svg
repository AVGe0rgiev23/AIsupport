<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
  <title id="t">SupportAI</title>
  <desc id="d">The support teammate that never sleeps: an AI chat widget that answers customers from your own documents and hands off to a human when it is unsure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1A"/>
      <stop offset="0.55" stop-color="#13103A"/>
      <stop offset="1" stop-color="#062A3A"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#F472B6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1 0; 0 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E1B4B" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#0F172A" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <mask id="moon">
      <rect width="1000" height="380" fill="#fff"/>
      <circle cx="905" cy="44" r="17" fill="#000"/>
    </mask>
    <clipPath id="frame"><rect width="1000" height="380" rx="22"/></clipPath>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .blob1 { animation: drift1 16s ease-in-out infinite; }
      .blob2 { animation: drift2 19s ease-in-out infinite; }
      .blob3 { animation: drift3 23s ease-in-out infinite; }
      @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(120px,40px); } }
      @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-140px,-30px); } }
      @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(60px,-60px); } }
      .star { animation: twinkle 3.2s ease-in-out infinite; }
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .95; } }
      .pulse { animation: pulse 1.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

      /* 10s chat loop */
      .b1 { animation: b1 10s infinite; }
      .ty { animation: ty 10s infinite; }
      .b2 { animation: b2 10s infinite; }
      .b3 { animation: b3 10s infinite; }
      .ft { animation: ft 10s infinite; }
      @keyframes b1 { 0%,6% { opacity:0; transform: translateY(10px); } 10%,90% { opacity:1; transform: translateY(0); } 96%,100% { opacity:0; transform: translateY(0); } }
      @keyframes ty { 0%,14% { opacity:0; } 17%,34% { opacity:1; } 36%,100% { opacity:0; } }
      @keyframes b2 { 0%,34% { opacity:0; transform: translateY(10px); } 38%,90% { opacity:1; transform: translateY(0); } 96%,100% { opacity:0; transform: translateY(0); } }
      @keyframes b3 { 0%,52% { opacity:0; transform: translateY(10px); } 56%,90% { opacity:1; transform: translateY(0); } 96%,100% { opacity:0; transform: translateY(0); } }
      @keyframes ft { 0%,66% { opacity:0; } 70%,90% { opacity:1; } 96%,100% { opacity:0; } }
      .dot { animation: bounce 1s ease-in-out infinite; }
      .dot2 { animation-delay: .15s; }
      .dot3 { animation-delay: .3s; }
      @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity:.5; } 30% { transform: translateY(-4px); opacity:1; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="380" fill="url(#bg)"/>

    <!-- aurora -->
    <circle class="blob1" cx="180" cy="320" r="150" fill="#7C3AED" opacity=".45" filter="url(#blur)"/>
    <circle class="blob2" cx="760" cy="90" r="160" fill="#0891B2" opacity=".45" filter="url(#blur)"/>
    <circle class="blob3" cx="520" cy="360" r="120" fill="#DB2777" opacity=".28" filter="url(#blur)"/>

    <!-- stars -->
    <g fill="#E0E7FF">
      <circle class="star" cx="60" cy="40" r="1.4"/>
      <circle class="star" style="animation-delay:.6s" cx="140" cy="92" r="1"/>
      <circle class="star" style="animation-delay:1.2s" cx="330" cy="28" r="1.6"/>
      <circle class="star" style="animation-delay:2s" cx="470" cy="70" r="1.1"/>
      <circle class="star" style="animation-delay:.3s" cx="560" cy="24" r="1.3"/>
      <circle class="star" style="animation-delay:1.7s" cx="610" cy="120" r="1"/>
      <circle class="star" style="animation-delay:2.4s" cx="820" cy="30" r="1.2"/>
      <circle class="star" style="animation-delay:.9s" cx="970" cy="120" r="1.5"/>
      <circle class="star" style="animation-delay:1.4s" cx="40" cy="200" r="1"/>
      <circle class="star" style="animation-delay:2.8s" cx="590" cy="330" r="1.2"/>
      <circle class="star" style="animation-delay:.5s" cx="975" cy="345" r="1.1"/>
      <circle class="star" style="animation-delay:2.1s" cx="410" cy="350" r="1.3"/>
      <circle class="star" style="animation-delay:1s" cx="250" cy="150" r=".9"/>
    </g>

    <!-- moon -->
    <g filter="url(#glow)">
      <circle cx="896" cy="50" r="18" fill="#FDE68A" mask="url(#moon)"/>
    </g>

    <!-- left copy -->
    <g transform="translate(56,0)">
      <rect x="0" y="62" width="318" height="30" rx="15" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".16"/>
      <circle class="pulse" cx="18" cy="77" r="5" fill="#34D399"/>
      <text x="32" y="82" font-size="12.5" font-weight="600" fill="#C7D2FE" letter-spacing="1.6">ONLINE 24/7 · ANSWERS FROM YOUR DOCS</text>

      <text x="-4" y="178" font-size="84" font-weight="800" letter-spacing="-2.5" fill="url(#brand)">SupportAI</text>
      <text x="0" y="226" font-size="27" font-weight="600" fill="#F8FAFC">The support teammate that never sleeps.</text>
      <text x="0" y="262" font-size="16.5" fill="#A5B4FC">Reads your help docs, answers customers in seconds,</text>
      <text x="0" y="286" font-size="16.5" fill="#A5B4FC">and knows exactly when to call in a human.</text>

      <g transform="translate(0,318)">
        <rect width="118" height="30" rx="8" fill="#22D3EE" fill-opacity=".12" stroke="#22D3EE" stroke-opacity=".4"/>
        <text x="59" y="20" font-size="13" font-weight="600" fill="#67E8F9" text-anchor="middle">RAG · cited</text>
        <rect x="128" width="138" height="30" rx="8" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".4"/>
        <text x="197" y="20" font-size="13" font-weight="600" fill="#C4B5FD" text-anchor="middle">Multi-tenant</text>
        <rect x="276" width="118" height="30" rx="8" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".4"/>
        <text x="335" y="20" font-size="13" font-weight="600" fill="#F9A8D4" text-anchor="middle">$0 / month</text>
      </g>
    </g>

    <!-- chat card -->
    <g class="float">
      <g transform="translate(620,78)" filter="url(#shadow)">
        <rect width="330" height="248" rx="18" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".12"/>
        <path d="M0 18 a18 18 0 0 1 18 -18 h294 a18 18 0 0 1 18 18 v30 h-330z" fill="#0F766E"/>
        <circle cx="26" cy="24" r="11" fill="#FFFFFF" fill-opacity=".2"/>
        <path d="M21 24 h10 M26 19 v10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <text x="46" y="29" font-size="14" font-weight="700" fill="#FFFFFF">Acme Support</text>
        <circle class="pulse" cx="262" cy="24" r="4" fill="#6EE7B7"/>
        <text x="272" y="28.5" font-size="11.5" fill="#CCFBF1">online</text>

        <!-- visitor -->
        <g class="b1">
          <rect x="120" y="64" width="194" height="34" rx="14" fill="#0EA5A4"/>
          <text x="217" y="86" font-size="13.5" fill="#FFFFFF" text-anchor="middle">Do you ship to Canada?</text>
        </g>
        <!-- typing -->
        <g class="ty">
          <rect x="16" y="110" width="62" height="32" rx="14" fill="#334155"/>
          <circle class="dot" cx="35" cy="126" r="3.5" fill="#CBD5E1"/>
          <circle class="dot dot2" cx="47" cy="126" r="3.5" fill="#CBD5E1"/>
          <circle class="dot dot3" cx="59" cy="126" r="3.5" fill="#CBD5E1"/>
        </g>
        <!-- bot -->
        <g class="b2">
          <rect x="16" y="110" width="236" height="52" rx="14" fill="#334155"/>
          <text x="30" y="131" font-size="13.5" fill="#F1F5F9">Yes! Canadian orders usually</text>
          <text x="30" y="150" font-size="13.5" fill="#F1F5F9">arrive in 5–7 business days.</text>
        </g>
        <!-- visitor 2 -->
        <g class="b3">
          <rect x="138" y="174" width="176" height="34" rx="14" fill="#0EA5A4"/>
          <text x="226" y="196" font-size="13.5" fill="#FFFFFF" text-anchor="middle">You're a lifesaver</text>
        </g>
        <!-- footer -->
        <g class="ft">
          <text x="16" y="233" font-size="11.5" fill="#94A3B8">answered at 2:14 AM · while the team sleeps</text>
        </g>
      </g>
    </g>
  </g>
</svg>
